# yaml-language-server: $schema=../../schemas/yaml/services_schema.yaml
# The names and descriptions here are only the fallback shown when a translation is
# missing; users see services.<action>.* from translations/en.json.

add_bill:
  name: Add bill
  description: Store a new utility bill in the ledger.
  fields:
    config_entry_id: &config_entry_id
      name: Integration entry
      description: The Home Ledger configuration entry to use.
      required: true
      example: 01JG3T2Q6Z9K4V8P0N5R7X2M1A
      selector:
        config_entry:
          integration: home_ledger
    bill_id:
      name: Bill ID
      description: Optional stable bill identifier. One is generated when omitted.
      example: electricity_january
      selector:
        text:
    utility_type:
      name: Utility type
      description: Type of utility.
      required: true
      example: electricity
      selector:
        select:
          options:
            - electricity
            - gas
            - water
            - other
    start_date:
      name: Start date
      description: First day covered by this bill.
      required: true
      example: "2026-01-01"
      selector:
        date:
    end_date:
      name: End date
      description: Last day covered by this bill.
      required: true
      example: "2026-01-31"
      selector:
        date:
    total_cost:
      name: Total cost
      description: Total cost of the bill, in Home Assistant's configured currency.
      required: true
      example: 143.52
      selector:
        number:
          min: 0
          mode: box
          step: 0.01
    consumption:
      name: Consumption
      description: Total consumption indicated on the bill.
      required: true
      example: 412.0
      selector:
        number:
          min: 0
          mode: box
          step: 0.1

update_bill:
  name: Update bill
  description: Update an existing utility bill in the ledger.
  fields:
    config_entry_id: *config_entry_id
    bill_id:
      name: Bill ID
      description: Stable identifier of the bill to update.
      required: true
      example: electricity_january
      selector:
        text:
    utility_type:
      name: Utility type
      description: New utility type.
      example: electricity
      selector:
        select:
          options:
            - electricity
            - gas
            - water
            - other
    start_date:
      name: Start date
      description: New first day covered by this bill.
      example: "2026-01-01"
      selector:
        date:
    end_date:
      name: End date
      description: New last day covered by this bill.
      example: "2026-01-31"
      selector:
        date:
    total_cost:
      name: Total cost
      description: New total cost, in Home Assistant's configured currency.
      example: 143.52
      selector:
        number:
          min: 0
          mode: box
          step: 0.01
    consumption:
      name: Consumption
      description: New consumption value.
      example: 412.0
      selector:
        number:
          min: 0
          mode: box
          step: 0.1

delete_bill:
  name: Delete bill
  description: Remove a utility bill from the ledger.
  fields:
    config_entry_id: *config_entry_id
    bill_id:
      name: Bill ID
      description: Stable identifier of the bill to delete.
      required: true
      example: electricity_january
      selector:
        text:

list_bills:
  name: List bills
  description: Return all utility bills stored in the ledger.
  fields:
    config_entry_id: *config_entry_id

add_activity:
  name: Add activity
  description: Record a new activity or maintenance note.
  fields:
    config_entry_id: *config_entry_id
    title:
      name: Title
      description: Summary of the activity.
      required: true
      example: "Solar panel cleaning"
      selector:
        text:
    description:
      name: Description
      description: Detailed notes about the activity.
      required: false
      example: "Cleaned all 10 panels using distilled water."
      selector:
        text:
